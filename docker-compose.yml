services:
  redis:
    image: redis:7-alpine
    container_name: careeros-redis
    command: >
      redis-server
      --requirepass "${REDIS_PASSWORD:-redispassword}"
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: careeros-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
    depends_on:
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: careeros-worker
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: careeros-web
    ports:
      - "5173:5173"
    environment:
      - INTERNAL_API_URL=http://api:8000
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules

volumes:
  redisdata:
