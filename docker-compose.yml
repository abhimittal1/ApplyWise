services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: careeros-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./apps/api:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: careeros-web
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      - INTERNAL_API_URL=http://api:8000
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules

